name: CREDICONTAFI - aplicaciones
on:
  workflow_dispatch:
  push:
    branches: ["main"]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm install
      - run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with: {name: CREDICONTAFI-Windows, path: dist/*.exe}
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      - uses: android-actions/setup-android@v3
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: {name: CREDICONTAFI-Android, path: android/app/build/outputs/apk/debug/*.apk}
