name: CREDICONTAFI - aplicaciones

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install
      - name: Compilar instalador Windows
        run: npm run desktop:build -- --publish never
      - name: Verificar instalador
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -Filter *.exe
          if ($files.Count -lt 1) { throw "No se generó el instalador EXE." }
          $files | Format-Table Name,Length
      - uses: actions/upload-artifact@v4
        with:
          name: CREDICONTAFI-Windows
          path: dist/*.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install
      - name: Preparar archivos web para Android
        shell: bash
        run: |
          rm -rf www
          mkdir -p www
          cp index.html cliente.html cliente.css cliente.js app.js styles.css online-config.js supabase-client-config.js logo.svg logo-credicontafi.svg manifest.webmanifest service-worker.js www/
      - name: Preparar Android
        run: npx cap add android
      - name: Sincronizar Capacitor
        run: npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - name: Preparar Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Verificar APK
        shell: bash
        run: |
          test -n "$(find android/app/build/outputs/apk/debug -name '*.apk' -print -quit)" || { echo "No se generó APK."; exit 1; }
          find android/app/build/outputs/apk/debug -name '*.apk' -ls
      - uses: actions/upload-artifact@v4
        with:
          name: CREDICONTAFI-Android
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - name: Descargar EXE
        uses: actions/download-artifact@v4
        with:
          name: CREDICONTAFI-Windows
          path: release
      - name: Descargar APK
        uses: actions/download-artifact@v4
        with:
          name: CREDICONTAFI-Android
          path: release
      - name: Publicar instaladores
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ github.run_number }}"
          gh release create "$TAG" release/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "CREDICONTAFI ${{ github.run_number }}" \
            --notes "Instaladores oficiales generados y verificados automáticamente. Incluye Windows EXE y Android APK."
